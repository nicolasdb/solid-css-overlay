# Every PR, every push to main and every tag: the guard's and the
# connector's tests, the image built, and the smoke run against that image in
# both pod layouts. Once per commit: a PR branch runs through pull_request
# only (it ran twice, push and pull_request, until 7.2.0-11). A change to
# docs only (*.md, docs/) skips it; a tag never does (GitHub applies no path
# filter to tags), so nothing is published untested. A tag v<stock>-<n>
# (v7.2.0-1) also publishes both images to GHCR as <stock>-<n>, public. A
# pre-release tag v<stock>-<n>-rc.<m> publishes <stock>-<n>-rc.<m> the same
# way, for the one instance that tries a version first (README, "Updating").
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A new push to a PR stops the run it makes obsolete. Never main or a tag:
# every one of those runs to the end.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pod-name-guard tests
        working-directory: pod-name-guard
        run: npm ci && npm test

      - name: mcp-connector tests
        working-directory: mcp-connector
        run: npm ci && npm test

      - name: build the image
        run: docker build -t solid-css-overlay:dev .

      - name: Caddy gateway builds with the OVH module, and the template parses
        run: |
          docker build -t caddy-ovh:ci gateway-caddy
          docker run --rm caddy-ovh:ci caddy list-modules | grep -x dns.providers.ovh
          sed -e 's/{{INSTANCE_NAME}}/ci/g' -e 's/{{DOMAIN}}/pod.example.org/g' \
            instance-template/Caddyfile.tmpl > "$RUNNER_TEMP/Caddyfile"
          docker run --rm -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e OVH_ENDPOINT=ovh-eu -e OVH_APPLICATION_KEY=x -e OVH_APPLICATION_SECRET=x -e OVH_CONSUMER_KEY=x \
            caddy-ovh:ci caddy validate --config /etc/caddy/Caddyfile

      - name: instance-template/update.sh parses
        run: bash -n instance-template/update.sh

      - name: stock templates unchanged since the overlay was reconciled
        run: scripts/check-overrides.sh

      # The runner's own Google Chrome, not a downloaded one:
      # `npx playwright install --with-deps chromium` installed system packages
      # through apt on every run, 18 s on a good day and 11 min 40 s on
      # 2026-10-27. If the runner's Chrome ever breaks the smoke run, put that
      # line back and drop CHROMIUM_PATH below.
      - name: the smoke run's library (the runner's own Chrome)
        working-directory: test
        run: npm ci && /usr/bin/google-chrome --version

      - name: smoke, subdomain pods (the image's default)
        env: { POD_LAYOUT: subdomain, TRY_NETWORK: host, CHROMIUM_PATH: /usr/bin/google-chrome }
        run: |
          test/try-local.sh 3123
          node test/smoke.mjs http://localhost:3123 test/shots/subdomain
          test/welcome-restart.sh 3123
          docker rm -f try-css-overlay-3123

      - name: smoke, folder pods (config/suffix.json)
        env: { POD_LAYOUT: suffix, TRY_NETWORK: host, CHROMIUM_PATH: /usr/bin/google-chrome }
        run: |
          test/try-local.sh 3124
          node test/smoke.mjs http://localhost:3124 test/shots/suffix
          test/welcome-restart.sh 3124

      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: test/shots/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: the tag must match the Dockerfile's CSS_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          stock="$(sed -n 's/^ARG CSS_VERSION=//p' Dockerfile)"
          # A pre-release is checked against the entry of the version it leads to.
          release="${tag%%-rc.*}"
          echo "$tag" | grep -Eq "^${stock//./\\.}-[0-9]+(-rc\.[0-9]+)?$" || { echo "tag $tag is not $stock-<n> or $stock-<n>-rc.<m>"; exit 1; }
          grep -Eq "^## ${release//./\.}( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $release'"; exit 1; }
          echo "VERSION=$tag" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: solid-css-overlay
        run: |
          docker build --build-arg OVERLAY_VERSION=$VERSION -t ghcr.io/nicolasdb/solid-css-overlay:$VERSION .
          docker push ghcr.io/nicolasdb/solid-css-overlay:$VERSION
      - name: solid-mcp-connector
        run: |
          docker build -t ghcr.io/nicolasdb/solid-mcp-connector:$VERSION mcp-connector
          docker push ghcr.io/nicolasdb/solid-mcp-connector:$VERSION
