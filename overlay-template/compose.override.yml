# The pods' look and words, mounted over the image's copies: the `pods/` folder
# of the vertical's design-system repo (solid-kit ADR 011; Maps of Making:
# mapsofmaking/design-system, checked out at /srv/mom-design-system). Copied
# from solid-css-overlay's overlay-template/. Never in the instance's checkout
# of solid-css-overlay, which is not edited. The checkout's .env loads it:
#   COMPOSE_FILE=compose.yml:/srv/<vertical>-design-system/pods/compose.override.yml
#   DESIGN_SYSTEM=/srv/<vertical>-design-system
# Paths go through ${DESIGN_SYSTEM}: Compose resolves relative paths from the
# checkout's folder, not from this file's.
#
# A line stays commented until its file exists: Compose mounts a missing path
# as an empty DIRECTORY, which then hides the image's file (a skin.css that is
# a folder means no skin at all). To turn one on, uncomment it and drop the
# `[]` below the list (it only keeps an all-commented list valid). That is a
# commit in the design-system repo, then `git pull` on the VPS and `docker
# compose up -d --force-recreate css` in the checkout (a plain `up -d` keeps
# the container, and with it the files from before the pull).
services:
  css:
    # environment:
      # An instance that already has pods as folders (solid-css-overlay
      # README: subdomains and folders are never interchangeable). The pages
      # and provider.json follow by themselves.
      # - CSS_CONFIG=/config/suffix.json
    volumes:
      # The vertical's kit skin, shared with every horizontal image (the
      # backoffice reads the same file): skins/kit/, not pods/.
      # - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/skins/kit/skin.css:/community-server/templates/styles/skin.css:ro
      # - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/skins/kit/fonts:/community-server/templates/fonts/skin:ro
      # The pods' own words, in this folder. The welcome page (the server's
      # home page: where a vertical lists its family of apps) is put at the
      # root at every start, so a new version is a `git pull` and the
      # recreate above; nothing to copy (README, "The welcome page").
      # - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/pods/welcome/index.html:/community-server/templates/root/intro/base/index.html:ro
      # The README every new pod starts with (`$$` is a literal `$` for
      # Compose). Pods made before keep theirs.
      # - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/pods/pod/README.md.hbs:/community-server/templates/pod/base/README$$.md.hbs:ro
      # More reserved pod names than the image's: a copy of config/instance.json.
      # - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/pods/instance.json:/config/instance.json:ro
      []
